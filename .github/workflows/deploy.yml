name: Deploy Next.js to Vercel

on:
  push:
    branches:
      - main   # Run only on push to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}    # Get from Vercel settings
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}  # Get from Vercel settings
          working-directory: .  # Root of your project
          prod: true            # Deploy to production
